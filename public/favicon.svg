<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Minecraft Diamond Sword / Block Pixel Art -->
  <rect width="16" height="16" fill="#121317" rx="3"/>
  <!-- Diamond blade/gem outline -->
  <rect x="7" y="1" width="2" height="2" fill="#55ffff"/>
  <rect x="9" y="2" width="2" height="2" fill="#2ce6e6"/>
  <rect x="6" y="2" width="2" height="2" fill="#aaffff"/>
  <rect x="5" y="3" width="2" height="2" fill="#55ffff"/>
  <rect x="8" y="3" width="2" height="2" fill="#ffffff"/>
  <rect x="6" y="4" width="2" height="2" fill="#55ffff"/>
  <rect x="4" y="4" width="2" height="2" fill="#00aaaa"/>
  <rect x="5" y="5" width="2" height="2" fill="#55ffff"/>
  <rect x="7" y="5" width="2" height="2" fill="#2ce6e6"/>
  <rect x="4" y="6" width="2" height="2" fill="#55ffff"/>
  <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="3" y="7" width="2" height="2" fill="#00aaaa"/>
  <rect x="5" y="7" width="2" height="2" fill="#55ffff"/>
  <!-- Crossguard -->
  <rect x="2" y="8" width="2" height="2" fill="#4a3219"/>
  <rect x="4" y="8" width="2" height="2" fill="#75512b"/>
  <rect x="7" y="8" width="2" height="2" fill="#55ffff"/>
  <rect x="8" y="9" width="2" height="2" fill="#4a3219"/>
  <!-- Hilt / Grip -->
  <rect x="3" y="9" width="2" height="2" fill="#75512b"/>
  <rect x="2" y="10" width="2" height="2" fill="#4a3219"/>
  <rect x="2" y="11" width="2" height="2" fill="#2b1c0e"/>
  <!-- Pommel -->
  <rect x="1" y="12" width="2" height="2" fill="#00aaaa"/>
  <rect x="2" y="13" width="2" height="2" fill="#55ffff"/>
</svg>
